[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanderdesk"
version = "0.1.0"
description = "An explorable, touch-friendly Linux application launcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wanderdesk = "wanderdesk:main"

[tool.setuptools]
py-modules = ["wanderdesk", "app_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
