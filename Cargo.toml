[package]
name = "wanderdesk"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "A native 3D Linux desktop world"
license = "MIT"

[dependencies]
bevy = { version = "=0.12.1", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_text", "bevy_ui", "bevy_winit", "default_font", "multi-threaded", "png", "tonemapping_luts", "x11", "wayland"] }
bevy_egui = "=0.24.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
shell-words = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"