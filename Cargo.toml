[package]
name = "wanderdesk"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A native, touch-friendly Linux application world"
license = "MIT"

[dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
shell-words = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1